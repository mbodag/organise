# Fly.io config for the memory server. The app name is passed with -a
# (see scripts/deploy-wizard.sh), so it isn't hard-coded here.

primary_region = "lhr"  # London; change to the region closest to you (fly platform regions)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  MEMORY_DIR = "/data/memory"
  GIT_BRANCH = "main"

[http_service]
  internal_port = 8787
  force_https = true
  # Always on: a stopped machine would make the connector slow or time out.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
