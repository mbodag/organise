# CI: typecheck and test the memory server on every PR and push.
# Uses no secrets, so it is safe to run on pull requests in this public repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  memory-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memory-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memory-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
